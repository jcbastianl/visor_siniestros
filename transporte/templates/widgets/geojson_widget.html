{% load static %}
<style>
    .geojson-widget-wrapper {
        padding: 15px;
        background-color: #1a1a2e;
        /* Dark background */
        border: 1px solid #333;
        border-radius: 8px;
        color: #e0e0e0;
        /* Light text */
        width: 100%;
        max-width: 100%;
        /* Force full width */
        box-sizing: border-box;
    }

    .geojson-map-container {
        width: 100%;
        height: 500px;
        /* Taller map for better visibility */
        margin-bottom: 15px;
        border: 2px solid #0f3460;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
    }

    .geojson-controls-bar {
        display: flex;
        gap: 12px;
        background: #16213e;
        /* Dark control bar */
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #0f3460;
        flex-wrap: wrap;
        align-items: center;
    }

    .geojson-controls-bar button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .geojson-controls-bar button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .btn-draw {
        background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
        color: white;
    }

    .btn-draw.active {
        background: linear-gradient(135deg, #fb8c00 0%, #ef6c00 100%);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .btn-clear {
        background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
        color: white;
    }

    .btn-save {
        background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
        color: white;
    }

    .btn-undo {
        background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
        color: white;
    }

    .btn-undo:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-format {
        background: #5e35b1;
        color: white;
        margin-top: 10px;
        padding: 8px 16px !important;
    }

    .btn-mode {
        color: white;
        transition: all 0.3s;
    }

    .geojson-textarea {
        width: 100%;
        height: 120px;
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 12px;
        padding: 15px;
        border: 1px solid #333;
        border-radius: 6px;
        background-color: #0d1b2a;
        /* Very dark background */
        color: #00d9ff;
        /* Cyan text */
        resize: vertical;
        box-sizing: border-box;
    }

    .geojson-help {
        margin-top: 10px;
        font-size: 12px;
        color: #aaa;
    }
</style>

<div class="geojson-widget-wrapper">
    <div class="geojson-controls-wrapper" style="margin-bottom: 10px;">
        <div class="geojson-controls-bar">
            <!-- Mode Switchers -->
            <div
                style="display: flex; gap: 5px; margin-right: 15px; border-right: 1px solid #333; padding-right: 15px;">
                <button type="button" class="btn-mode active" id="btn-mode-route-{{ widget.name }}"
                    style="background: #e74c3c;">📍 Modo Ruta</button>
                <button type="button" class="btn-mode" id="btn-mode-stops-{{ widget.name }}"
                    style="background: #333;">🚏 Modo Paradas</button>
            </div>

            <button type="button" class="btn-draw" id="btn-draw-{{ widget.name }}">✏️ Dibujar</button>
            <button type="button" class="btn-undo" id="btn-undo-{{ widget.name }}" disabled>↩ Deshacer</button>
            <button type="button" class="btn-clear" id="btn-clear-{{ widget.name }}">Limpiar</button>
            <button type="button" class="btn-save" id="btn-save-{{ widget.name }}">Guardar Todo</button>
        </div>
    </div>

    <div class="geojson-map-container" id="map-{{ widget.name }}">
    </div>

    <div style="margin-bottom: 10px; display: flex; align-items: center;">
        <button type="button" class="btn-format" id="btn-format-{{ widget.name }}">
            🪄 Pegar JSON y Extraer Geometría
        </button>
        <span style="font-size: 11px; color: #aaa; margin-left: 10px;">Pega tu FeatureCollection y haz click aquí</span>
    </div>

    <textarea name="{{ widget.name }}" id="id_{{ widget.name }}" class="geojson-textarea" {% if widget.attrs.placeholder
        %}placeholder="{{ widget.attrs.placeholder }}" {% endif
        %}>{% if widget.value and widget.value != 'None' %}{{ widget.value }}{% endif %}</textarea>

    <p class="geojson-help">
        <strong>Formato esperado:</strong> {"type": "LineString", "coordinates": [[lng, lat], ...]}
    </p>
</div>

<script>
    (function () {
        const fieldName = '{{ widget.name }}';
        const mapContainerId = 'map-' + fieldName;
        // Identificar si es campo principal (route) o campo paradas
        // En este nuevo enfoque, siempre asumimos que estamos en el widget del campo 'geom'
        // pero buscamos el campo 'paradas' oculto.
        const textareaId = 'id_' + fieldName;
        const paradasFieldId = 'id_paradas';

        function initMap() {
            if (typeof L === 'undefined') {
                console.error('Leaflet no esta cargado');
                return;
            }

            const mapContainer = document.getElementById(mapContainerId);
            const textarea = document.getElementById(textareaId);
            const paradasInput = document.getElementById(paradasFieldId);

            if (!mapContainer || mapContainer._leaflet_id) return;

            const map = L.map(mapContainerId).setView([-3.9932, -79.2044], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            // Capas para separar rutas y paradas
            const routeLayer = new L.FeatureGroup();
            const stopsLayer = new L.FeatureGroup();

            map.addLayer(routeLayer);
            map.addLayer(stopsLayer);

            // Estado
            let isDrawing = false;
            let currentMode = 'route'; // 'route' or 'stops'

            // Datos
            const routeCoordinates = [];
            let currentLine = null;

            const stopsCoordinates = [];
            const stopMarkers = [];

            // Referencias UI
            const btnDraw = document.getElementById('btn-draw-' + fieldName);
            const btnUndo = document.getElementById('btn-undo-' + fieldName);
            const btnClear = document.getElementById('btn-clear-' + fieldName);
            const btnSave = document.getElementById('btn-save-' + fieldName);

            const btnModeRoute = document.getElementById('btn-mode-route-' + fieldName);
            const btnModeStops = document.getElementById('btn-mode-stops-' + fieldName);

            // --- Funciones de Carga de Datos ---

            function loadRouteData() {
                try {
                    const val = textarea.value.trim();
                    routeLayer.clearLayers();
                    routeCoordinates.length = 0;

                    if (val && val !== '{}') {
                        const json = JSON.parse(val);
                        if (json.type === 'LineString' && json.coordinates) {
                            json.coordinates.forEach(c => routeCoordinates.push(c));

                            // Dibujar
                            const latLngs = routeCoordinates.map(c => [c[1], c[0]]);
                            currentLine = L.polyline(latLngs, { color: '#e74c3c', weight: 4 });
                            currentLine.addTo(routeLayer);
                            map.fitBounds(currentLine.getBounds(), { padding: [20, 20] });
                        }
                    }
                } catch (e) {
                    console.error("Error loading route:", e);
                }
            }

            function loadStopsData() {
                if (!paradasInput) return;
                try {
                    const val = paradasInput.value.trim();
                    stopsLayer.clearLayers();
                    stopsCoordinates.length = 0;
                    stopMarkers.length = 0;

                    if (val && val !== '[]' && val !== '{}' && val != 'None') {
                        // Manejar si viene como string JSON limpio
                        let json = JSON.parse(val);
                        if (Array.isArray(json)) {
                            json.forEach(c => {
                                stopsCoordinates.push(c);
                                addStopMarker([c[1], c[0]], false); // false = don't push to coords again
                            });
                        }
                    }
                } catch (e) {
                    console.error("Error loading stops - value:", paradasInput.value, e);
                }
            }

            function addStopMarker(latlng, pushData = true) {
                const marker = L.circleMarker(latlng, {
                    radius: 8,
                    fillColor: '#9c27b0',
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(stopsLayer);

                stopMarkers.push(marker);

                if (pushData) {
                    stopsCoordinates.push([latlng[1], latlng[0]]); // lng, lat
                }
            }

            // --- Funciones de Actualización UI ---

            function updateUI() {
                // Actualizar estilo de botones de modo
                if (btnModeRoute) {
                    btnModeRoute.style.opacity = currentMode === 'route' ? '1' : '0.5';
                    btnModeRoute.style.border = currentMode === 'route' ? '2px solid white' : 'none';
                }
                if (btnModeStops) {
                    btnModeStops.style.opacity = currentMode === 'stops' ? '1' : '0.5';
                    btnModeStops.style.border = currentMode === 'stops' ? '2px solid white' : 'none';
                }

                // Actualizar botón Draw
                if (btnDraw) {
                    btnDraw.classList.toggle('active', isDrawing);
                    if (isDrawing) {
                        btnDraw.textContent = currentMode === 'route' ? '✏️ Dibujando Ruta...' : '📍 Agregando Paradas...';
                        btnDraw.style.background = '#ff9800';
                    } else {
                        btnDraw.textContent = currentMode === 'route' ? '✏️ Dibujar Ruta' : '📍 Agregar Paradas';
                        btnDraw.style.background = '#43a047';
                    }
                }

                updateUndoButton();
            }

            function updateUndoButton() {
                if (!btnUndo) return;
                let hasHistory = false;
                if (currentMode === 'route') hasHistory = routeCoordinates.length > 0;
                if (currentMode === 'stops') hasHistory = stopsCoordinates.length > 0;
                btnUndo.disabled = !hasHistory;
            }

            // --- Event Listeners ---

            // Cambio de Modo
            if (btnModeRoute) btnModeRoute.addEventListener('click', () => {
                currentMode = 'route';
                isDrawing = false; // Stop drawing when switching mode
                updateUI();
            });
            if (btnModeStops) btnModeStops.addEventListener('click', () => {
                currentMode = 'stops';
                isDrawing = false;
                updateUI();
            });

            // Botón Dibujar
            if (btnDraw) {
                btnDraw.addEventListener('click', (e) => {
                    e.preventDefault();
                    isDrawing = !isDrawing;
                    updateUI();
                });
            }

            // Botón Guardar
            if (btnSave) {
                btnSave.addEventListener('click', (e) => {
                    e.preventDefault();

                    // Guardar Ruta
                    if (routeCoordinates.length >= 2) {
                        const geojson = { type: 'LineString', coordinates: routeCoordinates };
                        textarea.value = JSON.stringify(geojson);
                    } else if (routeCoordinates.length === 0) {
                        textarea.value = ''; // Limpiar si borró todo
                    }

                    // Guardar Paradas
                    if (paradasInput) {
                        if (stopsCoordinates.length > 0) {
                            paradasInput.value = JSON.stringify(stopsCoordinates);
                        } else {
                            paradasInput.value = '[]';
                        }
                    }

                    isDrawing = false;
                    updateUI();
                    alert(`¡Guardado exitoso!\n- Ruta: ${routeCoordinates.length} puntos\n- Paradas: ${stopsCoordinates.length} marcadas\n\n(No olvides dar click en 'Guardar' al final del formulario)`);
                });
            }

            // Botón Limpiar
            if (btnClear) {
                btnClear.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (confirm(`¿Estás seguro de LIMPIAR todos los datos del modo ${currentMode === 'route' ? 'RUTA' : 'PARADAS'}?`)) {
                        if (currentMode === 'route') {
                            routeCoordinates.length = 0;
                            routeLayer.clearLayers();
                            currentLine = null;
                            textarea.value = '{}';
                        } else {
                            stopsCoordinates.length = 0;
                            stopMarkers.length = 0;
                            stopsLayer.clearLayers();
                            if (paradasInput) paradasInput.value = '[]';
                        }
                        updateUI();
                    }
                });
            }

            // Botón Deshacer
            if (btnUndo) {
                btnUndo.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (currentMode === 'route' && routeCoordinates.length > 0) {
                        routeCoordinates.pop();
                        // Redibujar
                        if (currentLine) routeLayer.removeLayer(currentLine);
                        if (routeCoordinates.length > 1) {
                            const latLngs = routeCoordinates.map(c => [c[1], c[0]]);
                            currentLine = L.polyline(latLngs, { color: '#e74c3c', weight: 4 }).addTo(routeLayer);
                        } else {
                            currentLine = null;
                        }
                    } else if (currentMode === 'stops' && stopsCoordinates.length > 0) {
                        stopsCoordinates.pop();
                        const marker = stopMarkers.pop();
                        if (marker) stopsLayer.removeLayer(marker);
                    }
                    updateUI();
                });
            }

            // Click en Mapa
            map.on('click', (e) => {
                if (!isDrawing) return;

                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                if (currentMode === 'route') {
                    routeCoordinates.push([lng, lat]);

                    // Feedback visual inmediato (círculo pequeño)
                    L.circleMarker([lat, lng], { radius: 2, color: 'red' }).addTo(routeLayer);

                    if (routeCoordinates.length > 1) {
                        if (currentLine) routeLayer.removeLayer(currentLine);
                        const latLngs = routeCoordinates.map(c => [c[1], c[0]]);
                        currentLine = L.polyline(latLngs, { color: '#e74c3c', weight: 4 }).addTo(routeLayer);
                    }
                } else {
                    // Stops
                    addStopMarker([lat, lng]);
                }
                updateUI();
            });

            // Inicializar
            loadRouteData();
            // Pequeño delay para asegurar que el DOM del admin haya cargado el otro campo si es inline (aunque hidden input debe estar ahi)
            setTimeout(loadStopsData, 500);
            updateUI();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMap);
        } else {
            setTimeout(initMap, 100);
        }
    })();
</script>
