{% load static %}
<style>
    .geojson-widget-wrapper {
        padding: 15px;
        background-color: #1a1a2e;
        /* Dark background */
        border: 1px solid #333;
        border-radius: 8px;
        color: #e0e0e0;
        /* Light text */
        width: 100%;
        max-width: 100%;
        /* Force full width */
        box-sizing: border-box;
    }

    .geojson-map-container {
        width: 100%;
        height: 500px;
        /* Taller map for better visibility */
        margin-bottom: 15px;
        border: 2px solid #0f3460;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
    }

    .geojson-controls-bar {
        display: flex;
        gap: 12px;
        background: #16213e;
        /* Dark control bar */
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #0f3460;
        flex-wrap: wrap;
        align-items: center;
    }

    .geojson-controls-bar button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .geojson-controls-bar button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .btn-draw {
        background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
        color: white;
    }

    .btn-draw.active {
        background: linear-gradient(135deg, #fb8c00 0%, #ef6c00 100%);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .btn-clear {
        background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
        color: white;
    }

    .btn-save {
        background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
        color: white;
    }

    .btn-format {
        background: #5e35b1;
        color: white;
        margin-top: 10px;
        padding: 8px 16px !important;
    }

    .geojson-textarea {
        width: 100%;
        height: 120px;
        font-family: 'Fira Code', 'Consolas', monospace;
        font-size: 12px;
        padding: 15px;
        border: 1px solid #333;
        border-radius: 6px;
        background-color: #0d1b2a;
        /* Very dark background */
        color: #00d9ff;
        /* Cyan text */
        resize: vertical;
        box-sizing: border-box;
    }

    .geojson-help {
        margin-top: 10px;
        font-size: 12px;
        color: #aaa;
    }
</style>

<div class="geojson-widget-wrapper">
    <div class="geojson-controls-wrapper" style="margin-bottom: 10px;">
        <div class="geojson-controls-bar">
            <button type="button" class="btn-draw" id="btn-draw-{{ widget.name }}">Dibujar Ruta</button>
            <button type="button" class="btn-clear" id="btn-clear-{{ widget.name }}">Limpiar</button>
            <button type="button" class="btn-save" id="btn-save-{{ widget.name }}">Guardar Dibujo</button>
        </div>
    </div>

    <div class="geojson-map-container" id="map-{{ widget.name }}">
    </div>

    <div style="margin-bottom: 10px; display: flex; align-items: center;">
        <button type="button" class="btn-format" id="btn-format-{{ widget.name }}">
            🪄 Pegar JSON y Extraer Geometría
        </button>
        <span style="font-size: 11px; color: #aaa; margin-left: 10px;">Pega tu FeatureCollection y haz click aquí</span>
    </div>

    <textarea name="{{ widget.name }}" id="id_{{ widget.name }}" class="geojson-textarea" {% if widget.attrs.placeholder
        %}placeholder="{{ widget.attrs.placeholder }}" {% endif
        %}>{% if widget.value and widget.value != 'None' %}{{ widget.value }}{% endif %}</textarea>

    <p class="geojson-help">
        <strong>Formato esperado:</strong> {"type": "LineString", "coordinates": [[lng, lat], ...]}
    </p>
</div>

<script>
    (function () {
        const fieldName = '{{ widget.name }}';
        const mapContainerId = 'map-' + fieldName;
        const textareaId = 'id_' + fieldName;

        function initMap() {
            if (typeof L === 'undefined') {
                console.error('Leaflet no esta cargado');
                return;
            }

            const mapContainer = document.getElementById(mapContainerId);
            const textarea = document.getElementById(textareaId);

            if (!mapContainer || mapContainer._leaflet_id) return;

            const map = L.map(mapContainerId).setView([-3.9932, -79.2044], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            const drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            let isDrawing = false;
            let currentLine = null;
            const coordinates = [];
            const markers = [];

            // Función para cargar datos desde el textarea al mapa
            function loadFromTextarea() {
                try {
                    const existingData = textarea.value.trim();
                    drawnItems.clearLayers();

                    if (existingData && existingData !== '{}') {
                        const geojson = JSON.parse(existingData);

                        // Soporte para LineString directo
                        if (geojson.type === 'LineString' && geojson.coordinates && geojson.coordinates.length > 0) {
                            const latLngs = geojson.coordinates.map(coord => [coord[1], coord[0]]);
                            const polyline = L.polyline(latLngs, { color: '#e74c3c', weight: 4 });
                            polyline.addTo(drawnItems);
                            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                        }
                    }
                } catch (e) {
                    console.log('Error al parsear JSON existente:', e);
                }
            }

            // Cargar datos iniciales
            loadFromTextarea();

            const btnDraw = document.getElementById('btn-draw-' + fieldName);
            const btnClear = document.getElementById('btn-clear-' + fieldName);
            const btnSave = document.getElementById('btn-save-' + fieldName);
            const btnFormat = document.getElementById('btn-format-' + fieldName);

            // Logica para Formatear/Extraer JSON
            btnFormat.addEventListener('click', function (e) {
                e.preventDefault();
                try {
                    const rawData = textarea.value.trim();
                    if (!rawData) {
                        alert('Primero pega el JSON FeatureCollection en el cuadro de texto.');
                        return;
                    }

                    const json = JSON.parse(rawData);
                    let geometry = null;

                    // Caso 1: FeatureCollection
                    if (json.type === 'FeatureCollection' && json.features && json.features.length > 0) {
                        geometry = json.features[0].geometry;
                    }
                    // Caso 2: Feature individual
                    else if (json.type === 'Feature' && json.geometry) {
                        geometry = json.geometry;
                    }

                    if (geometry && geometry.type === 'LineString') {
                        // Formatear bonito
                        textarea.value = JSON.stringify(geometry, null, 2);
                        // Actualizar mapa
                        loadFromTextarea();
                        alert('¡Geometría extraída correctamente!');
                    } else {
                        alert('No se encontró una geometría LineString válida en el JSON.');
                    }
                } catch (err) {
                    alert('JSON inválido. Verifica que hayas copiado todo correctamente.');
                    console.error(err);
                }
            });

            btnDraw.addEventListener('click', function (e) {
                e.preventDefault();
                isDrawing = !isDrawing;
                this.textContent = isDrawing ? 'Dibujando...' : 'Dibujar Ruta';
                this.classList.toggle('active', isDrawing);
                if (isDrawing) {
                    coordinates.length = 0;
                    markers.forEach(m => drawnItems.removeLayer(m));
                    markers.length = 0;
                    if (currentLine) {
                        drawnItems.removeLayer(currentLine);
                        currentLine = null;
                    }
                }
            });

            btnClear.addEventListener('click', function (e) {
                e.preventDefault();
                coordinates.length = 0;
                markers.forEach(m => drawnItems.removeLayer(m));
                markers.length = 0;
                if (currentLine) {
                    drawnItems.removeLayer(currentLine);
                    currentLine = null;
                }
                drawnItems.clearLayers();
                isDrawing = false;
                btnDraw.textContent = 'Dibujar Ruta';
                btnDraw.classList.remove('active');
                textarea.value = '{}';
            });

            btnSave.addEventListener('click', function (e) {
                e.preventDefault();
                if (coordinates.length >= 2) {
                    const geojson = {
                        type: 'LineString',
                        coordinates: coordinates.slice()
                    };
                    textarea.value = JSON.stringify(geojson, null, 2);
                    isDrawing = false;
                    btnDraw.textContent = 'Dibujar Ruta';
                    btnDraw.classList.remove('active');
                    alert('Ruta guardada: ' + coordinates.length + ' puntos');
                } else {
                    alert('Necesitas al menos 2 puntos para crear una ruta');
                }
            });

            map.on('click', function (e) {
                if (!isDrawing) return;

                const latlng = e.latlng;
                coordinates.push([latlng.lng, latlng.lat]);

                const marker = L.circleMarker([latlng.lat, latlng.lng], {
                    radius: 6,
                    fillColor: '#e74c3c',
                    color: '#c0392b',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(drawnItems);
                markers.push(marker);

                if (coordinates.length > 1) {
                    if (currentLine) {
                        drawnItems.removeLayer(currentLine);
                    }
                    const latLngs = coordinates.map(coord => [coord[1], coord[0]]);
                    currentLine = L.polyline(latLngs, { color: '#e74c3c', weight: 4 });
                    currentLine.addTo(drawnItems);
                }
            });

            setTimeout(function () {
                map.invalidateSize();
            }, 100);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMap);
        } else {
            setTimeout(initMap, 100);
        }
    })();
</script>
