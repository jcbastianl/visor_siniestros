services:
  - type: web
    name: visor-siniestros
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn visor_backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: visor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: visor-db
    databaseName: visor_siniestros
    user: visor_user
    plan: free
